# ============================================
# RENDER DEPLOYMENT CONFIGURATION
# ============================================
# Note: Sensitive values are set in Render Dashboard, not here.
# This file documents the expected environment variables.

services:
  - type: web
    name: notaryton-bot
    runtime: python
    plan: free
    # The pinned, hashed set (see requirements.txt for how to regenerate it).
    buildCommand: pip install --require-hashes -r requirements.lock
    startCommand: python bot.py
    healthCheckPath: /health
    envVars:
      # Telegram Bots (set in dashboard)
      - key: BOT_TOKEN
        sync: false
      - key: MEMESEAL_BOT_TOKEN
        sync: false
      # Required: sent with setWebhook and checked on every update. Unset, the
      # webhooks are not registered and every Telegram update is rejected.
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

      # TON Blockchain (set in dashboard)
      - key: TON_WALLET_SECRET
        sync: false
      - key: SERVICE_TON_WALLET
        sync: false
      - key: TON_CENTER_API_KEY
        sync: false

      # TonAPI for webhooks (set in dashboard)
      - key: TONAPI_KEY
        sync: false
      # Optional. Unset, /webhook/tonapi rejects everything (see .env.template).
      - key: TONAPI_WEBHOOK_SECRET
        sync: false

      # Optional. Unset, /admin/* and POST /api/v1/kols/seed are disabled.
      - key: ADMIN_SECRET
        sync: false

      # Database (auto-linked from Render PostgreSQL)
      - key: DATABASE_URL
        fromDatabase:
          name: notaryton-db
          property: connectionString

      # Webhook URL
      - key: WEBHOOK_URL
        value: https://notaryton.com

      # Twitter/X API (set in dashboard)
      - key: TWITTER_API_KEY
        sync: false
      - key: TWITTER_API_SECRET
        sync: false
      - key: TWITTER_ACCESS_TOKEN
        sync: false
      - key: TWITTER_ACCESS_TOKEN_SECRET
        sync: false

      # Optional
      - key: GROUP_IDS
        value: ""

databases:
  - name: notaryton-db
    plan: free
    databaseName: notaryton
    user: notaryton
